  };
  const products=[
    {id:'EVO-3850-220',name:'Esteira EVO 3850 AC',line:'COMERCIAL · CARDIO',kind:'tread',desc:'220 V · 180 × 88 × 135 cm',price:'R$ 14.490',physical:8,reserved:2,available:6,style:'dark'},
    {id:'SP-2600',name:'Bicicleta SP2600',line:'COMERCIAL · CARDIO',kind:'bike',desc:'Spinning · uso comercial',price:'R$ 5.590',physical:12,reserved:1,available:11,style:'cream'},

  let state={page:'dashboard',query:'',filter:'Todos',quotes:[...quotes],movements:[],newCount:0};
  const classFor = value => ({'Aprovado':'teal','Pago':'teal','Entregue':'teal','Entrada recebida':'teal','Pedido ativo':'teal','Aguardando cliente':'amber','Em negociação':'amber','Aguardando fabricação':'amber','Entrega parcial':'amber','Parcial':'amber','Proposta enviada':'blue','Pronto para expedir':'blue','Rascunho':'gray','Sem estoque':'red'}[value]||'gray');

  function art(kind){return kind==='tread'?`<svg viewBox="0 0 180 105"><path d="M26 75h115l12 9H19zM26 75l22-14 92 3M133 68l4-49 16-3M145 17h19M49 29h47M96 29l26 36M33 85a7 7 0 1 0 14 0M129 85a7 7 0 1 0 14 0"/></svg>`:kind==='bike'?`<svg viewBox="0 0 180 105"><circle cx="45" cy="76" r="20"/><circle cx="137" cy="76" r="20"/><path d="m45 76 31-38 23 38H45l25-29M137 76l-25-40H77M64 33h23M105 31h19M121 31l16 45M99 76l14-3"/></svg>`:`<svg viewBox="0 0 180 105"><path d="M34 91V16h112v75M34 16h112M52 91V32h35v59M105 91V33h27v58M45 37h42M46 47h41M46 57h41M116 34v50M68 16v16M122 16v17M26 91h128M70 76h23l12-16"/></svg>`}

  function projects(){

      `<div class="grid stats">${stat('Modelos de exemplo',String(products.length),'Catálogo compartilhado','◫','blue')}${stat('Unidades físicas',String(physical),'Saldo de todos os modelos','▣','teal')}${stat('Reservadas',String(reserved),'Vinculadas a pedidos','◈','orange')}${stat('Disponíveis',String(physical-reserved),'Físico menos reservado','✓','teal')}</div>`+
      `<div class="toolbar"><div class="tabs">${['Todos','COMERCIAL','EVOLUTION PRO','RESIDENCIAL'].map(x=>`<button class="tab ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><span class="smallmuted">Saídas e ajustes não podem comprometer itens reservados</span></div>`+

      `<div class="mutednote">Consulta dos itens pendentes dos seus pedidos. A atualização das compras e da fabricação dependerá do processo operacional da empresa.</div>`+
      `<div class="grid stats">${stat('Itens pendentes','1','Do meu pedido PED-1042','◈','orange')}${stat('Em fabricação','1','Estação ST4 Raptor','⚙','blue')}${stat('Em compra','0','Nenhum item da minha carteira','▣','teal')}${stat('Previsão','14 out','Conclusão demonstrativa','◷','orange')}</div>`+
      `<div class="grid two"><section class="panel"><div class="panelhead"><h2>Item do meu pedido aguardando disponibilidade</h2><span class="smallmuted">Consulta</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Origem</th><th>Item</th><th>Via</th><th>Previsão</th><th></th></tr></thead><tbody><tr><td><strong>PED-1042</strong><small>Condomínio Aurora</small></td><td>1 × Estação ST4 Raptor</td><td>${badge('Fabricação')}</td><td>14 out</td><td><button class="tablebutton" data-open="supply:ST4">Abrir →</button></td></tr></tbody></table></div></section><section class="panel"><div class="panelhead"><h2>Previsão · Estação ST4 Raptor</h2><span class="status amber">Em andamento</span></div><div class="panelbody"><div class="timeline"><div class="timeitem"><b>Pedido aprovado</b><small>PED-1042 · 02 out</small></div><div class="timeitem"><b>Fabricação em andamento</b><small>Previsão: 14 out</small></div><div class="timeitem pending"><b>Produto disponível</b><small>Aguardando confirmação</small></div><div class="timeitem pending"><b>Reserva para o pedido</b><small>Próxima etapa da operação</small></div></div></div></section></div>`;
  }
  function delivery(){
    return header('Acompanhar entregas',pages.delivery.subtitle)+
      `<div class="mutednote">Remessas dos seus pedidos, em modo de consulta. As datas e confirmações serão atualizadas pela operação ou pelo sistema integrado.</div>`+
      `<div class="grid stats">${stat('A separar','1','Remessa da minha carteira','◫','blue')}${stat('Conferidos','0','Aguardando conferência','✓','teal')}${stat('Em transporte','0','Nenhuma remessa minha','↗','orange')}${stat('Entregues','1','Pedido PED-1039','◧','orange')}</div>`+
      `<div class="grid split"><section class="panel tablewrap"><div class="panelhead" style="padding-bottom:14px"><h2>Remessas dos meus pedidos</h2><span class="smallmuted">Consulta por pedido e item</span></div><table class="table"><thead><tr><th>Remessa</th><th>Cliente / pedido</th><th>Conteúdo</th><th>Previsão</th><th>Situação</th><th></th></tr></thead><tbody><tr><td><strong>REM-332</strong></td><td>Condomínio Aurora<small>PED-1042</small></td><td>3 de 4 itens</td><td>08 out</td><td>${badge('Separação')}</td><td><button class="tablebutton" data-open="delivery:REM-332">Abrir →</button></td></tr><tr><td><strong>REM-329</strong></td><td>Clínica Movimento<small>PED-1039</small></td><td>3 de 3 itens</td><td>30 set</td><td>${badge('Entregue')}</td><td><button class="tablebutton" data-open="delivery:REM-329">Abrir →</button></td></tr></tbody></table></section><section class="panel"><div class="panelhead"><h2>Etapas da entrega</h2></div><div class="panelbody"><div class="timeline"><div class="timeitem"><b>Itens reservados</b><small>Vinculados ao seu pedido</small></div><div class="timeitem"><b>Separação e conferência</b><small>Quantidades e volumes</small></div><div class="timeitem pending"><b>Expedição</b><small>Data e transporte</small></div><div class="timeitem pending"><b>Recebimento</b><small>Comprovante e ocorrências</small></div></div></div></section></div>`;
  }
  function reports(){
    const data=[21,28,26,32,30,41,37,39,51,58,47,55];
    return header('Meus indicadores',pages.reports.subtitle)+
      `<div class="grid stats">${stat('Minhas vendas no período','R$ 86.260','Exemplo · outubro','↗','orange')}${stat('Minha conversão','50%','Exemplo de propostas','◷','blue')}${stat('Meus pedidos no prazo','1 de 2','Exemplo de carteira','✓','teal')}${stat('Itens pendentes','1','Pedido PED-1042','!','orange')}</div>`+
      `<div class="grid half"><section class="panel"><div class="panelhead"><h2>Evolução das minhas vendas</h2><span class="smallmuted">Valores ilustrativos</span></div><div class="panelbody" style="padding-bottom:34px"><div class="figures">${data.map((x,i)=>`<div class="fig-col"><div class="block ${i===9?'highlight':''}" style="height:${x*2}px"></div><span>${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][i]}</span></div>`).join('')}</div></div></section><section class="panel"><div class="panelhead"><h2>Meu funil comercial</h2><span class="smallmuted">Oportunidades desta carteira</span></div><div class="panelbody">${[['Oportunidades',2,100],['Propostas',2,100],['Aprovados',1,50]].map(r=>`<div class="funnelrow"><span>${r[0]}</span><div class="track"><i style="width:${r[2]}%"></i></div><strong>${r[1]}</strong></div>`).join('')}<div class="hline"></div><span class="smallmuted">Contagem demonstrativa, limitada aos meus clientes.</span></div></section></div><div class="grid half" style="margin-top:18px"><section class="panel"><div class="panelhead"><h2>Meus pedidos</h2></div><div class="panelbody"><div class="detailpair"><span>Em andamento</span><strong>1</strong></div><div class="detailpair"><span>Com item pendente</span><strong>1</strong></div><div class="detailpair"><span>Entregues</span><strong>1</strong></div></div></section><section class="panel"><div class="panelhead"><h2>O que acompanhar</h2></div><div class="panelbody"><div class="detailpair"><span>Orçamento aguardando retorno</span><strong>Por cliente</strong></div><div class="detailpair"><span>Prazo prometido × realizado</span><strong>Por pedido</strong></div><div class="detailpair"><span>Itens pendentes</span><strong>Por entrega</strong></div></div></section></div>`;
  }
  const views={dashboard,crm,projects,catalog,quotes:quotesPage,orders:ordersPage,stock,supply,delivery,reports};
  function render(){
    let last='';$('#nav').innerHTML=Object.entries(pages).map(([id,p])=>{let group=p.group===last?'':`<div class="navlabel">${p.group}</div>`;last=p.group;return `${group}<button class="navitem ${state.page===id?'active':''}" data-page="${id}"><span class="ni">${icons(p.icon)}</span>${p.name}${id==='orders'?`<span class="pillnav">${orders.filter(o=>o.operation!=='Entregue').length}</span>`:''}</button>`}).join('');
    $('#crumb').textContent=pages[state.page].name;$('#main').innerHTML=views[state.page]();$('#search').value=state.query;
  }
  function navigate(page){if(!pages[page])return;state.page=page;state.query='';state.filter='Todos';render();window.scrollTo(0,0);$('#sidebar').classList.remove('open');history.replaceState(null,'',`#${page}`)}
  function pair(left,right){return `<div class="detailpair"><span>${left}</span><strong>${right}</strong></div>`}
  function drawer(type,id){
    let title='',sub='',kick='',body='';
    if(type==='lead'){let x=leads.find(a=>a.client===id);if(!x)return;title=x.client;sub=x.name;kick='OPORTUNIDADE';body=`<div class="mutednote">Exemplo de oportunidade para validar o fluxo comercial.</div>${pair('Etapa',x.stage)}${pair('Valor estimado',x.value)}${pair('Origem',x.origin)}${pair('Responsável',x.owner)}${pair('Próxima atividade',x.date)}<div class="hline"></div><button class="btn primary" data-page="quotes">Ver orçamentos</button>`}
    else if(type==='client'||type==='project'){let x=clients.find(a=>a.name===id)||clients[0];title=x.name;sub=id==='Aurora'?'Academia do condomínio':x.type;kick=type==='project'?'PROJETO':'CLIENTE';body=`${pair('Tipo',x.type)}${pair('Cidade',x.city)}${pair('Contato principal',x.contact)}${pair('Projetos',x.projects)}${pair('Situação',x.stage)}<div class="hline"></div><h3 style="font-size:13px">Projeto vinculado</h3><p class="subtitle">Equipamentos, local de instalação e documentos serão reunidos aqui.</p>`}
    else if(type==='quote'){let q=state.quotes.find(a=>a.id===id);if(!q)return;title=q.id;sub=q.client;kick='ORÇAMENTO';body=`${pair('Projeto',q.project)}${pair('Valor',q.value)}${pair('Situação',q.status)}${pair('Versão','v2 · proposta atual')}${pair('Responsável',q.owner)}${pair('Origem',q.channel)}<div class="hline"></div><p class="subtitle">A versão aprovada registra itens, preços, descontos, frete e prazo. O pedido mantém esses valores históricos.</p>${q.status==='Aprovado'?'<p><button class="btn primary" data-page="orders">Ver pedido vinculado</button></p>':''}`}
    else if(type==='order'){let o=orders.find(a=>a.id===id);if(!o)return;title=o.id;sub=o.client;kick='PEDIDO DE VENDA';body=`${pair('Origem',o.origin)}${pair('Valor aprovado',o.value)}${pair('Comercial','Aprovado')}${pair('Financeiro',o.financial)}${pair('Operação',o.operation)}${pair('Prazo',o.date)}<div class="hline"></div><h3 style="font-size:13px">Atendimento por item</h3>${o.id==='PED-1042'?`${pair('2 × Esteira EVO 3850 AC','Reservadas')}${pair('1 × Bicicleta SP2600','Reservada')}${pair('1 × Estação ST4','Em fabricação')}`:pair(o.items,'Acompanhar disponibilidade')}<div class="hline"></div><button class="btn primary" data-page="supply">Ver abastecimento</button>`}
    else if(type==='stock'){let p=products.find(a=>a.id===id);if(!p)return;title=p.name;sub=p.id;kick='ESTOQUE';body=`${pair('Linha',p.line)}${pair('Estoque físico',p.physical)}${pair('Reservado em pedidos',p.reserved)}${pair('Disponível',p.available)}${pair('Detalhe',p.desc)}<div class="hline"></div><button class="btn primary" data-action="movement" data-product="${p.id}">Registrar movimentação</button>`}
    else if(type==='supply'){title=id==='ST4'?'Estação ST4 Raptor':id;sub=id==='ST4'?'OF-207 · PED-1042':'Necessidade vinculada a pedido';kick='ABASTECIMENTO';body=`${pair('Origem',id==='ST4'?'PED-1042':'Pedido relacionado')}${pair('Quantidade',id==='ST4'?'1 unidade':'Conforme pedido')}${pair('Processo',id==='EL1002'?'Compra':'Fabricação')}${pair('Situação','Em andamento')}${pair('Previsão',id==='ST4'?'14 out 2026':'A confirmar')}<div class="hline"></div><p class="subtitle">Quando o item estiver disponível, poderá ser reservado ao pedido e incluído em uma remessa.</p>`}
    else if(type==='delivery'){title=id;sub=id==='REM-332'?'Condomínio Aurora':'Clínica Movimento';kick='ENTREGA';body=`${pair('Pedido',id==='REM-332'?'PED-1042':'PED-1039')}${pair('Situação',id==='REM-332'?'Separação':'Entregue')}${pair('Recebimento',id==='REM-332'?'Pendente':'Confirmado')}<div class="hline"></div><h3 style="font-size:13px">Conferência</h3><p class="subtitle">Quantidades, volumes, transportadora e comprovante de entrega ficam associados à remessa.</p>`}
    $('#drawer-kicker').textContent=kick;$('#drawer-title').textContent=title;$('#drawer-sub').textContent=sub;$('#drawer-body').innerHTML=body;$('#overlay').classList.add('open');$('#overlay').setAttribute('aria-hidden','false');
  }
  const closeDrawer=()=>{$('#overlay').classList.remove('open');$('#overlay').setAttribute('aria-hidden','true')};
  const closeModal=()=>{$('#modaloverlay').classList.remove('open');$('#modaloverlay').setAttribute('aria-hidden','true')};
  function modal(mode,productId){
    state.modalMode=mode;
    $('#modal-title').textContent=mode==='opportunity'?'Nova oportunidade':mode==='project'?'Novo projeto':mode==='movement'?'Registrar movimentação':'Novo orçamento';
    const note='<div class="mutednote">Protótipo visual: os dados preenchidos ficam apenas nesta sessão e não são enviados.</div>';
    const customer='<label class="field">Cliente<input name="client" required placeholder="Ex.: Condomínio Aurora"></label>';
    const owner='<label class="field">Vendedora responsável<input name="owner" value="Camila Martins" readonly></label>'; 
    let fields='';
    if(mode==='movement')fields='<label class="field">Produto<select name="product" required>'+products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')+'</select></label><label class="field">Tipo<select name="type"><option value="Entrada">Entrada</option><option value="Saída">Saída</option><option value="Ajuste">Ajuste de saldo</option></select></label><label class="field">Quantidade<input name="quantity" type="number" min="0" step="1" required placeholder="No ajuste: saldo físico contado"></label><label class="field">Motivo<input name="reason" required placeholder="Ex.: recebimento ou inventário"></label>'+owner;
    else if(mode==='opportunity')fields=customer+'<label class="field">Oportunidade<input name="project" required placeholder="Ex.: Nova academia"></label><label class="field">Origem<select name="origin"><option>Site</option><option>Vendedor</option><option>Parceiro</option></select></label><label class="field">Valor estimado<input name="value" placeholder="Ex.: R$ 40.000"></label>'+owner;
    else if(mode==='project')fields=customer+'<label class="field">Nome do projeto<input name="project" required placeholder="Ex.: Espaço fitness"></label><label class="field">Tipo de cliente<select name="type"><option>Academia</option><option>Condomínio</option><option>Hotel</option><option>Studio</option><option>Outros</option></select></label><label class="field">Cidade / UF<input name="city" placeholder="Ex.: Joinville · SC"></label>'+owner;
    else fields=customer+'<label class="field">Projeto<input name="project" required placeholder="Ex.: Academia do condomínio"></label><label class="field">Produto principal<select name="product"><option>Esteira EVO 3850 AC</option><option>Bicicleta SP2600</option><option>Estação ST4 Raptor</option><option>Leg Press 4000 PRO</option></select></label><label class="field">Quantidade<input name="quantity" type="number" min="1" max="100" value="1" required></label><label class="field">Prazo desejado<input name="date" type="date"></label>'+owner;
    $('#demo-form .modalbody').innerHTML=note+'<div class="formgrid">'+fields+'</div>';
    $('#demo-form button[type="submit"]').textContent=mode==='opportunity'?'Adicionar oportunidade':mode==='project'?'Adicionar projeto':mode==='movement'?'Registrar movimentação':'Adicionar orçamento';
    $('#modaloverlay').classList.add('open');$('#modaloverlay').setAttribute('aria-hidden','false');$('#demo-form').reset();
    if(mode==='movement'&&productId)$('#demo-form select[name="product"]').value=productId;
  }
  function recordMovement(data){
    const product=products.find(p=>p.id===data.product);
    const qty=Number(data.quantity);
    if(!product||!['Entrada','Saída','Ajuste'].includes(data.type)||!Number.isInteger(qty)||qty<0||(data.type!=='Ajuste'&&qty===0))return {ok:false,message:'Informe um produto, tipo e quantidade válidos.'};
    const reason=(data.reason||'').trim();
    if(!reason)return {ok:false,message:'Informe o motivo da movimentação.'};
    const before=product.physical;
    const after=data.type==='Entrada'?before+qty:data.type==='Saída'?before-qty:qty;
    if(after<product.reserved)return {ok:false,message:'O saldo não pode ficar abaixo da quantidade reservada em pedidos.'};
    product.physical=after;
    product.available=after-product.reserved;
    state.movements.unshift({date:new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date()),product:product.name,type:data.type,quantity:qty,before,after,reason,seller:seller.name});
    return {ok:true,message:'Movimentação registrada na demonstração.'};
  }
  let toastTimer;function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('on'),3500)}
  document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){closeDrawer();navigate(nav.dataset.page);return}let filt=e.target.closest('[data-filter]');if(filt){state.filter=filt.dataset.filter;render();return}let open=e.target.closest('[data-open]');if(open){let [kind,...rest]=open.dataset.open.split(':');drawer(kind,rest.join(':'));return}let action=e.target.closest('[data-action]');if(action){closeDrawer();modal(action.dataset.action,action.dataset.product);return}let msg=e.target.closest('[data-toast]');if(msg){toast(msg.dataset.toast);return}});
  $('#search').addEventListener('input',e=>{let start=e.target.selectionStart;state.query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(start,start)});
  $('#menubtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
  $('#close-drawer').addEventListener('click',closeDrawer);$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDrawer()});
  $('#close-modal').addEventListener('click',closeModal);$('#cancel-modal').addEventListener('click',closeModal);$('#modaloverlay').addEventListener('click',e=>{if(e.target.id==='modaloverlay')closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});
  $('#demo-form').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget).entries());if(state.modalMode==='movement'){const result=recordMovement(data);if(!result.ok){toast(result.message);return}closeModal();navigate('stock');toast(result.message);return}if(!data.client.trim()||!data.project.trim())return;state.newCount++;const client=data.client.trim(),project=data.project.trim();if(state.modalMode==='quote'){state.quotes.unshift({id:'ORC-DEMO-'+String(state.newCount).padStart(3,'0'),client,project,value:'A definir',date:'02 out 2026',status:'Rascunho',owner:seller.name,channel:'Protótipo',product:data.product,quantity:data.quantity});closeModal();navigate('quotes');toast('Orçamento demonstrativo adicionado nesta sessão.')}else if(state.modalMode==='opportunity'){leads.unshift({client,name:project,value:data.value||'A definir',owner:seller.id,stage:'Novos contatos',date:'Criado agora',origin:data.origin});closeModal();navigate('crm');toast('Oportunidade demonstrativa adicionada nesta sessão.')}else{clients.unshift({name:client,type:data.type,city:data.city||'A definir',contact:data.owner,projects:1,stage:'Rascunho',owner:seller.name});closeModal();navigate('projects');toast('Projeto demonstrativo adicionado nesta sessão.')}});
  const initial=location.hash.slice(1);if(pages[initial])state.page=initial;render();
</script>
</body>
</html>
